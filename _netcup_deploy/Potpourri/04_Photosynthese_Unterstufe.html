<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulation: Photosynthese mit Wasserpest</title>
  <style>
    :root{
      --bg1:#0f172a;
      --bg2:#020617;
      --panel:#111827;
      --border:#334155;
      --text:#e5e7eb;
      --muted:#94a3b8;
      --accent:#38bdf8;
      --green:#22c55e;
      --warm:#f8fafc;
      --lamp:#fde68a;
      --hot:#fb7185;
    }

    *{box-sizing:border-box;}

    body{
      margin:0;
      min-height:100vh;
      padding:20px;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      background:radial-gradient(circle at top,#1e293b 0,var(--bg1) 42%,var(--bg2) 100%);
    }

    .app{
      width:min(980px,100%);
      margin:0 auto;
    }

    .sim-card{
      padding:10px;
      border:1px solid var(--border);
      border-radius:22px;
      background:linear-gradient(180deg,rgba(17,24,39,.96),rgba(2,6,23,.98));
      box-shadow:0 20px 50px rgba(0,0,0,.35);
    }

    .sim-window{
      position:relative;
      min-height:560px;
      border:1px solid rgba(148,163,184,.16);
      border-radius:20px;
      overflow:hidden;
      background:
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(0deg,rgba(255,255,255,.025) 1px,transparent 1px),
        radial-gradient(circle at 60% 20%,rgba(56,189,248,.08),transparent 28%),
        rgba(2,6,23,.42);
      background-size:28px 28px,28px 28px,100% 100%,100% 100%;
    }

    .controls{
      position:absolute;
      left:16px;
      top:16px;
      z-index:20;
      width:268px;
      padding:14px;
      display:grid;
      gap:12px;
      border:1px solid rgba(148,163,184,.22);
      border-radius:16px;
      background:linear-gradient(180deg,rgba(17,24,39,.94),rgba(2,6,23,.96));
      box-shadow:0 18px 36px rgba(0,0,0,.28);
    }

    .title{
      margin:0;
      font-size:.94rem;
      font-weight:800;
      letter-spacing:.01em;
      color:#f8fafc;
      white-space:nowrap;
    }

    .subtle{
      margin:0;
      color:var(--muted);
      font-size:.77rem;
      line-height:1.35;
    }

    .group{
      display:grid;
      gap:8px;
    }

    .label-row{
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      gap:8px;
      font-size:.8rem;
      color:var(--muted);
      font-weight:650;
    }

    .value{
      color:#f8fafc;
      font-weight:800;
      font-size:.92rem;
    }

    .segmented{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }

    .distance-btn,
    button{
      border:0;
      border-radius:14px;
      min-height:40px;
      padding:9px 10px;
      font-size:.83rem;
      font-weight:780;
      cursor:pointer;
      transition:transform .15s ease, filter .15s ease, opacity .15s ease;
    }

    button:hover:not(:disabled),
    .distance-btn:hover:not(:disabled){
      transform:translateY(-1px);
      filter:brightness(1.05);
    }

    button:active:not(:disabled),
    .distance-btn:active:not(:disabled){
      transform:translateY(0);
    }

    button:disabled,
    .distance-btn:disabled{
      opacity:.5;
      cursor:not-allowed;
    }

    .distance-btn{
      background:linear-gradient(180deg,#1f2937,#0f172a);
      color:#dbeafe;
      border:1px solid rgba(148,163,184,.18);
    }

    .distance-btn.active{
      background:linear-gradient(180deg,#dbeafe,#7dd3fc);
      color:#082f49;
      border-color:transparent;
    }

    input[type="range"]{
      width:100%;
      accent-color:var(--hot);
      cursor:pointer;
    }

    .scale{
      display:flex;
      justify-content:space-between;
      margin-top:-4px;
      color:#64748b;
      font-size:.68rem;
      font-weight:650;
    }

    .btn-start{ background:linear-gradient(180deg,#bbf7d0,#22c55e); color:#052e16; }
    .btn-pause{ background:linear-gradient(180deg,#fef3c7,#f59e0b); color:#451a03; }
    .btn-reset{ background:linear-gradient(180deg,#e5e7eb,#cbd5e1); color:#111827; }

    .readouts{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
    }

    .chip{
      padding:10px 8px;
      border-radius:14px;
      background:rgba(15,23,42,.78);
      border:1px solid rgba(148,163,184,.18);
      text-align:center;
    }

    .clickable-chip{
      cursor:pointer;
      user-select:none;
      transition:transform .15s ease, border-color .15s ease, background .15s ease;
    }

    .clickable-chip:hover{
      transform:translateY(-1px);
      border-color:rgba(125,211,252,.5);
      background:rgba(15,23,42,.92);
    }

    .chip-label{
      display:block;
      font-size:.68rem;
      color:var(--muted);
      font-weight:650;
      margin-bottom:4px;
    }

    .chip-value{
      display:block;
      font-size:1rem;
      color:#f8fafc;
      font-weight:850;
      font-variant-numeric:tabular-nums;
    }

    .status{
      display:none;
    }

    .window-toggle{
      position:absolute;
      right:16px;
      top:16px;
      z-index:25;
      min-width:52px;
      min-height:34px;
      padding:6px 12px;
      border:1px solid rgba(148,163,184,.22);
      border-radius:999px;
      background:rgba(15,23,42,.78);
      color:#e2e8f0;
      font-size:.76rem;
      font-weight:800;
      letter-spacing:.02em;
      cursor:pointer;
      backdrop-filter:blur(8px);
      transition:transform .15s ease, filter .15s ease, background .15s ease;
    }

    .window-toggle:hover{
      transform:translateY(-1px);
      filter:brightness(1.08);
      background:rgba(30,41,59,.9);
    }

    .sim-window:fullscreen{
      min-height:100vh;
      border-radius:0;
    }

    .sim-window:fullscreen .controls{
      top:20px;
      left:20px;
    }

    canvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
    }

    @media (max-width:780px){
      body{padding:14px;}
      .sim-window{min-height:760px;}
      .controls{
        left:14px;
        right:14px;
        top:auto;
        bottom:14px;
        width:auto;
      }
      .window-toggle{right:14px; top:14px;}
    }
  
    /* edubiosim-fullscreen styles */
    .fullscreen-enter-btn,
    .fullscreen-exit-btn{
      position:fixed;
      right:16px;
      bottom:16px;
      z-index:91;
      align-items:center;
      gap:8px;
      min-height:42px;
      padding:9px 13px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.72);
      background:rgba(255,255,255,.92);
      color:#182033;
      font-weight:900;
      box-shadow:0 12px 30px rgba(0,0,0,.20);
      backdrop-filter:blur(8px);
    }
    .fullscreen-enter-btn{left:16px;right:auto;display:inline-flex}
    .fullscreen-exit-btn{left:16px;right:auto;display:none}
    .fullscreen-enter-btn svg,
    .fullscreen-exit-btn svg{width:22px;height:22px;display:block}
    html:fullscreen .fullscreen-exit-btn,
    html.fullscreen-active .fullscreen-exit-btn{display:inline-flex}
    html:-webkit-full-screen .fullscreen-exit-btn{display:inline-flex}
    html:fullscreen .fullscreen-enter-btn,
    html.fullscreen-active .fullscreen-enter-btn{display:none}
    html:-webkit-full-screen .fullscreen-enter-btn{display:none}
    .fullscreen-enter-btn:hover,
    .fullscreen-exit-btn:hover{transform:translateY(-1px);box-shadow:0 14px 34px rgba(0,0,0,.24)}
    .fullscreen-enter-btn:focus-visible,
    .fullscreen-exit-btn:focus-visible{outline:3px solid rgba(21,135,123,.35);outline-offset:3px}
</style>
</head>
<body>
  <main class="app">
    <section class="sim-card">
      <div class="sim-window">
        <section class="controls" aria-label="Steuerung">
          <div class="group">
            <p class="title">Photosynthese mit Wasserpest</p>
          </div>

          <div class="group">
            <div class="label-row">
              <span>Lampenabstand</span>
              <span class="value" id="distanceValue">20 cm</span>
            </div>
            <div class="segmented">
              <button class="distance-btn" data-distance="10">10 cm</button>
              <button class="distance-btn active" data-distance="20">20 cm</button>
              <button class="distance-btn" data-distance="30">30 cm</button>
            </div>
          </div>

          <div class="group">
            <div class="label-row">
              <span>Wassertemperatur</span>
              <span class="value" id="tempValue">20 °C</span>
            </div>
            <input id="tempSlider" type="range" min="10" max="50" value="20" step="10" aria-label="Wassertemperatur" />
            <div class="scale"><span>10 °C</span><span>50 °C</span></div>
          </div>

          <div class="readouts">
            <div class="chip">
              <span class="chip-label">Zeit</span>
              <span class="chip-value" id="timeValue">00:00</span>
            </div>
            <div class="chip">
              <span class="chip-label">Bläschen</span>
              <span class="chip-value" id="bubbleCountValue">0</span>
            </div>
            <div class="chip clickable-chip" id="rateChip" role="button" tabindex="0" aria-label="Bläschen pro Minute anzeigen">
              <span class="chip-label">pro Minute</span>
              <span class="chip-value" id="rateValue">0</span>
            </div>
          </div>

          <div class="group">
            <button id="startBtn" class="btn-start">Messung starten</button>
            <button id="pauseBtn" class="btn-pause" disabled>Pause</button>
            <button id="resetBtn" class="btn-reset">Zurücksetzen</button>
          </div>
        </section>

        <button id="windowToggle" class="window-toggle" type="button" aria-label="Simulation maximieren">Max</button>
        <div class="status" id="statusLabel">bereit</div>
        <canvas id="canvas" aria-label="Simulation der Photosynthese mit Wasserpest"></canvas>
      </div>
    </section>
  </main>

  <script>
    const simWindow = document.querySelector('.sim-window');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const tempSlider = document.getElementById('tempSlider');
    const tempValue = document.getElementById('tempValue');
    const distanceValue = document.getElementById('distanceValue');
    const bubbleCountValue = document.getElementById('bubbleCountValue');
    const rateValue = document.getElementById('rateValue');
    const rateChip = document.getElementById('rateChip');
    const timeValue = document.getElementById('timeValue');
    const statusLabel = document.getElementById('statusLabel');
    const windowToggle = document.getElementById('windowToggle');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const distanceButtons = [...document.querySelectorAll('.distance-btn')];

    const VIEW = { w: 860, h: 560 };
    const aquarium = { x: 305, y: 64, w: 290, h: 390 };
    const waterLineY = aquarium.y + 38;
    const waterweedAnchor = { x: aquarium.x + aquarium.w / 2, y: aquarium.y + aquarium.h - 30 };

    const state = {
      distance: 20,
      temperature: 20,
      rateVisible: false,
      measuring: false,
      paused: false,
      measurementStart: 0,
      elapsed: 0,
      bubbleCount: 0,
      bubbles: [],
      lastTime: 0,
      spawnCarry: 0
    };

    const lampImage = new Image();
    lampImage.src = 'Bilder/lamp.png';
    const plantImage = new Image();
    plantImage.src = 'Bilder/wasserpest.png';

    function updateWindowToggle(){
      const isFullscreen = document.fullscreenElement === simWindow;
      windowToggle.textContent = isFullscreen ? 'Min' : 'Max';
      windowToggle.setAttribute('aria-label', isFullscreen ? 'Simulation verkleinern' : 'Simulation maximieren');
      setTimeout(fitCanvas, 30);
    }

    async function toggleFullscreen(){
      try{
        if(document.fullscreenElement === simWindow){
          await document.exitFullscreen();
        }else{
          await simWindow.requestFullscreen();
        }
      }catch(err){
        console.error(err);
      }
    }

    function fitCanvas(){
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(canvas.width / VIEW.w, 0, 0, canvas.height / VIEW.h, 0, 0);
    }

    function rand(min,max){ return min + Math.random() * (max - min); }
    function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

    function formatTime(ms){
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
    }

    function getBaseBubbleRate(){
      if(state.distance === 10) return 104;
      if(state.distance === 20) return 56;
      return 24;
    }

    function getTemperatureFactor(){
      // RGT-Regel bis 30 °C: ca. Verdopplung je 10 °C.
      // 40 °C ist bereits ein Grenzwert, 50 °C führt zur Denaturierung.
      const factors = {
        10: 0.25,
        20: 0.50,
        30: 1.00,
        40: 0.45,
        50: 0.03
      };
      return factors[state.temperature] ?? 0.50;
    }

    function getBubbleRatePerMinute(){
      return getBaseBubbleRate() * getTemperatureFactor();
    }

    function updateReadouts(){
      tempValue.textContent = `${state.temperature} °C`;
      distanceValue.textContent = `${state.distance} cm`;
      bubbleCountValue.textContent = String(state.bubbleCount);
      timeValue.textContent = formatTime(state.elapsed);
      const perMin = Math.round(getBubbleRatePerMinute());
      rateValue.textContent = state.rateVisible ? String(perMin) : 'anzeigen';
    }

    function setControlsLocked(locked){
      distanceButtons.forEach(btn => btn.disabled = locked);
      tempSlider.disabled = locked;
      startBtn.disabled = locked;
      pauseBtn.disabled = !locked;
    }

    function setDistance(distance){
      if(state.measuring) return;
      state.distance = distance;
      distanceButtons.forEach(btn => btn.classList.toggle('active', Number(btn.dataset.distance) === distance));
      updateReadouts();
      statusLabel.textContent = distance === 10 ? 'starke Beleuchtung' : distance === 20 ? 'mittlere Beleuchtung' : 'schwächere Beleuchtung';
    }

    function startMeasurement(){
      if(state.measuring) return;
      state.measuring = true;
      state.paused = false;
      state.measurementStart = performance.now();
      state.elapsed = 0;
      state.bubbleCount = 0;
      state.rateVisible = false;
      state.bubbles.length = 0;
      state.spawnCarry = 0;
      setControlsLocked(true);
      pauseBtn.textContent = 'Pause';
      statusLabel.textContent = 'Messung läuft';
      updateReadouts();
    }

    function togglePause(){
      if(!state.measuring) return;
      if(state.paused){
        state.paused = false;
        state.measurementStart = performance.now() - state.elapsed;
        pauseBtn.textContent = 'Pause';
        statusLabel.textContent = 'Messung läuft';
      }else{
        state.paused = true;
        state.elapsed = performance.now() - state.measurementStart;
        pauseBtn.textContent = 'Fortsetzen';
        statusLabel.textContent = 'pausiert';
      }
      updateReadouts();
    }

    function reset(){
      state.measuring = false;
      state.paused = false;
      state.measurementStart = 0;
      state.elapsed = 0;
      state.bubbleCount = 0;
      state.rateVisible = false;
      state.bubbles.length = 0;
      state.spawnCarry = 0;
      pauseBtn.textContent = 'Pause';
      setControlsLocked(false);
      statusLabel.textContent = 'bereit';
      updateReadouts();
    }

    function spawnBubble(){
      const startPoints = [
        { x: waterweedAnchor.x - 12, y: aquarium.y + aquarium.h - 76 },
        { x: waterweedAnchor.x + 8, y: aquarium.y + aquarium.h - 118 },
        { x: waterweedAnchor.x - 16, y: aquarium.y + aquarium.h - 164 },
        { x: waterweedAnchor.x + 12, y: aquarium.y + aquarium.h - 206 },
        { x: waterweedAnchor.x - 6, y: aquarium.y + aquarium.h - 248 }
      ];
      const p = startPoints[Math.floor(Math.random() * startPoints.length)];
      state.bubbles.push({
        x: p.x + rand(-6, 6),
        y: p.y + rand(-4, 4),
        r: rand(3.6, 7.2),
        vy: rand(42, 66),
        drift: rand(-16, 16),
        wobble: rand(0, Math.PI * 2),
        alpha: rand(.55, .9)
      });
      state.bubbleCount += 1;
    }

    function updateSimulation(dt, now){
      if(state.measuring && !state.paused){
        state.elapsed = now - state.measurementStart;
        const perSecond = getBubbleRatePerMinute() / 60;
        state.spawnCarry += perSecond * dt;
        while(state.spawnCarry >= 1){
          spawnBubble();
          state.spawnCarry -= 1;
        }
      }

      for(let i = state.bubbles.length - 1; i >= 0; i--){
        const b = state.bubbles[i];
        b.y -= b.vy * dt;
        b.x += Math.sin((now / 400) + b.wobble) * 10 * dt + b.drift * dt * 0.2;
        if(b.y < waterLineY - 6){
          state.bubbles.splice(i,1);
        }
      }
    }

    function roundRect(x,y,w,h,r){
      const rr = Math.min(r, w/2, h/2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.lineTo(x + w - rr, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
      ctx.lineTo(x + w, y + h - rr);
      ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
      ctx.lineTo(x + rr, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
      ctx.lineTo(x, y + rr);
      ctx.quadraticCurveTo(x, y, x + rr, y);
    }

    function drawScene(){
      ctx.clearRect(0,0,VIEW.w,VIEW.h);
      drawLamp();
      drawAquarium();
      drawWaterweed();
      drawSubstrate();
      drawThermometer();
      drawBubbles();
    }

    function drawTable(){
    }

    function drawLamp(){
      const lampLeft = state.distance === 10 ? 612 : state.distance === 20 ? 676 : 740;
      const lampTop = 78;
      const drawW = 150;
      const drawH = 255;
      const intensity = state.distance === 10 ? 1.25 : state.distance === 20 ? 0.72 : 0.26;

      // small brown table centered below the lamp base and only touching it
      const tableX = lampLeft + 21;
      const tableY = lampTop + 220;
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(tableX + 54, tableY + 18, 58, 9, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,.22)';
      ctx.fill();
      ctx.restore();

      const tableGrad = ctx.createLinearGradient(tableX, tableY, tableX, tableY + 14);
      tableGrad.addColorStop(0, '#a26d3f');
      tableGrad.addColorStop(1, '#6a4427');
      roundRect(tableX, tableY, 108, 12, 6);
      ctx.fillStyle = tableGrad;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.10)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = '#5a3a22';
      ctx.fillRect(tableX + 12, tableY + 12, 8, 19);
      ctx.fillRect(tableX + 88, tableY + 12, 8, 19);

      // light cone: narrower at the lamp, slightly higher, broader toward the aquarium
      const sourceTop = { x: lampLeft + 28, y: lampTop + 63 };
      const sourceBottom = { x: lampLeft + 57, y: lampTop + 95 };
      const targetTop = { x: aquarium.x + aquarium.w - 2, y: aquarium.y + 74 };
      const targetBottom = { x: aquarium.x + aquarium.w - 2, y: aquarium.y + 326 };

      ctx.save();
      const beamGrad = ctx.createLinearGradient(sourceTop.x, sourceTop.y, aquarium.x + aquarium.w - 24, aquarium.y + 196);
      beamGrad.addColorStop(0, `rgba(255,244,200,${0.38 * intensity})`);
      beamGrad.addColorStop(.22, `rgba(253,230,138,${0.26 * intensity})`);
      beamGrad.addColorStop(.62, `rgba(250,204,21,${0.16 * intensity})`);
      beamGrad.addColorStop(1, 'rgba(250,204,21,0)');
      ctx.beginPath();
      ctx.moveTo(sourceTop.x, sourceTop.y);
      ctx.lineTo(targetTop.x, targetTop.y);
      ctx.lineTo(targetBottom.x, targetBottom.y);
      ctx.lineTo(sourceBottom.x, sourceBottom.y);
      ctx.closePath();
      ctx.fillStyle = beamGrad;
      ctx.fill();

      // additional inner glow so the different lamp distances are easier to recognize visually
      const innerBeam = ctx.createLinearGradient(sourceTop.x, sourceTop.y, aquarium.x + aquarium.w - 40, aquarium.y + 188);
      innerBeam.addColorStop(0, `rgba(255,248,210,${0.24 * intensity})`);
      innerBeam.addColorStop(.45, `rgba(254,240,138,${0.12 * intensity})`);
      innerBeam.addColorStop(1, 'rgba(254,240,138,0)');
      ctx.beginPath();
      ctx.moveTo(sourceTop.x + 5, sourceTop.y + 4);
      ctx.lineTo(targetTop.x - 18, targetTop.y + 30);
      ctx.lineTo(targetBottom.x - 18, targetBottom.y - 30);
      ctx.lineTo(sourceBottom.x - 2, sourceBottom.y - 4);
      ctx.closePath();
      ctx.fillStyle = innerBeam;
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(sourceTop.x, sourceTop.y);
      ctx.lineTo(targetTop.x, targetTop.y);
      ctx.moveTo(sourceBottom.x, sourceBottom.y);
      ctx.lineTo(targetBottom.x, targetBottom.y);
      ctx.strokeStyle = `rgba(253,230,138,${0.18 * intensity})`;
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.restore();

      if(lampImage.complete){
        ctx.drawImage(lampImage, lampLeft, lampTop, drawW, drawH);
      }
    }

    function drawAquarium(){
      const x = aquarium.x;
      const y = aquarium.y;
      const w = aquarium.w;
      const h = aquarium.h;
      const innerX = x + 12;
      const innerW = w - 24;
      const waterBottom = y + h - 12;

      ctx.save();
      ctx.beginPath();
      ctx.ellipse(x + w / 2, y + h + 10, 112, 12, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,.20)';
      ctx.fill();
      ctx.restore();

      // water fill
      const waterGrad = ctx.createLinearGradient(0, waterLineY, 0, waterBottom);
      waterGrad.addColorStop(0, 'rgba(191,219,254,.34)');
      waterGrad.addColorStop(.14, 'rgba(191,219,254,.28)');
      waterGrad.addColorStop(1, 'rgba(147,197,253,.22)');
      ctx.fillStyle = waterGrad;
      ctx.fillRect(innerX, waterLineY, innerW, waterBottom - waterLineY);

      // water surface
      ctx.beginPath();
      ctx.moveTo(innerX, waterLineY + 1);
      ctx.quadraticCurveTo(x + w * .32, waterLineY + 5, x + w * .56, waterLineY + 2);
      ctx.quadraticCurveTo(x + w * .80, waterLineY - 1, x + w - 12, waterLineY + 3);
      ctx.strokeStyle = 'rgba(191,219,254,.62)';
      ctx.lineWidth = 2.1;
      ctx.stroke();

      // outer glass
      ctx.strokeStyle = 'rgba(226,232,240,.92)';
      ctx.lineWidth = 4;
      ctx.strokeRect(x, y, w, h);

      // inner glass border
      ctx.strokeStyle = 'rgba(191,219,254,.55)';
      ctx.lineWidth = 1.8;
      ctx.strokeRect(x + 7, y + 7, w - 14, h - 14);

      // highlights
      ctx.beginPath();
      ctx.moveTo(x + 16, y + 18);
      ctx.lineTo(x + 16, y + h - 26);
      ctx.strokeStyle = 'rgba(255,255,255,.24)';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x + w - 18, y + 22);
      ctx.lineTo(x + w - 18, y + h - 34);
      ctx.strokeStyle = 'rgba(255,255,255,.12)';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.stroke();

      // top rim
      ctx.beginPath();
      ctx.moveTo(x + 6, y + 10);
      ctx.lineTo(x + w - 6, y + 10);
      ctx.strokeStyle = 'rgba(248,250,252,.92)';
      ctx.lineWidth = 3;
      ctx.stroke();

      // bottom inner line
      ctx.beginPath();
      ctx.moveTo(x + 14, y + h - 10);
      ctx.lineTo(x + w - 14, y + h - 10);
      ctx.strokeStyle = 'rgba(191,219,254,.38)';
      ctx.lineWidth = 1.7;
      ctx.stroke();
    }

    function drawSubstrate(){
      const cx = waterweedAnchor.x;
      const baseY = aquarium.y + aquarium.h - 18;

      ctx.save();
      ctx.beginPath();
      ctx.rect(aquarium.x + 12, aquarium.y + 26, aquarium.w - 24, aquarium.h - 38);
      ctx.clip();

      const moundGrad = ctx.createLinearGradient(cx - 62, baseY - 24, cx + 62, baseY + 16);
      moundGrad.addColorStop(0, 'rgba(142,101,60,.82)');
      moundGrad.addColorStop(.5, 'rgba(107,74,44,.94)');
      moundGrad.addColorStop(1, 'rgba(76,54,36,.88)');

      ctx.beginPath();
      ctx.moveTo(cx - 58, baseY + 2);
      ctx.quadraticCurveTo(cx - 34, baseY - 14, cx - 8, baseY - 12);
      ctx.quadraticCurveTo(cx + 8, baseY - 24, cx + 24, baseY - 14);
      ctx.quadraticCurveTo(cx + 44, baseY - 15, cx + 58, baseY + 2);
      ctx.lineTo(cx + 58, baseY + 13);
      ctx.lineTo(cx - 58, baseY + 13);
      ctx.closePath();
      ctx.fillStyle = moundGrad;
      ctx.fill();

      const pebbles = [
        [-34, 0, 8, 4, 0.12], [-19, -3, 6, 3.3, -0.08], [-5, 2, 7, 4, 0.14],
        [14, -4, 7.5, 3.8, -0.12], [28, 1, 8.5, 4.4, 0.08]
      ];
      pebbles.forEach(([dx,dy,rx,ry,rot], i) => {
        ctx.beginPath();
        ctx.ellipse(cx + dx, baseY + dy, rx, ry, rot, 0, Math.PI * 2);
        ctx.fillStyle = i % 2 === 0 ? 'rgba(159,122,78,.72)' : 'rgba(86,62,42,.84)';
        ctx.fill();
      });

      ctx.restore();
    }

    function drawWaterweed(){
      const x = waterweedAnchor.x;
      const y = waterweedAnchor.y;

      ctx.save();
      ctx.beginPath();
      ctx.rect(aquarium.x + 14, waterLineY + 6, aquarium.w - 28, aquarium.h - 24);
      ctx.clip();
      if(plantImage.complete){
        ctx.drawImage(plantImage, x - 76, y - 286, 152, 304);
      }
      ctx.restore();
    }

    function drawThermometer(){
      const tx = aquarium.x + aquarium.w - 66;
      const ty = aquarium.y + 88;
      const bulbCenterY = ty + 118;
      const bulbRadius = 13;
      const stemBottomY = bulbCenterY - bulbRadius + 1;
      const stemTopY = ty + 8;
      const maxFillHeight = stemBottomY - stemTopY;
      const tempRatio = clamp((state.temperature - 10) / 40, 0, 1);
      const fillHeight = maxFillHeight * tempRatio;

      ctx.save();
      ctx.shadowColor = 'rgba(255,255,255,.22)';
      ctx.shadowBlur = 8;
      roundRect(tx - 9, ty - 10, 18, 132, 9);
      ctx.fillStyle = 'rgba(255,255,255,.36)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(248,250,252,.92)';
      ctx.lineWidth = 1.8;
      ctx.stroke();
      ctx.restore();

      if(fillHeight > 0){
        roundRect(tx - 3.4, stemBottomY - fillHeight, 6.8, fillHeight, 3.4);
        ctx.fillStyle = '#ef4444';
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(tx, bulbCenterY, bulbRadius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(254,202,202,.98)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(248,250,252,.72)';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(tx, bulbCenterY, 7.5, 0, Math.PI * 2);
      ctx.fillStyle = '#ef4444';
      ctx.fill();
    }

    function drawBubbles(){
      state.bubbles.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(219,234,254,${b.alpha * .34})`;
        ctx.fill();
        ctx.strokeStyle = `rgba(255,255,255,${b.alpha * 1.05})`;
        ctx.lineWidth = 1.7;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * 0.72, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(191,219,254,${b.alpha * .45})`;
        ctx.lineWidth = 0.9;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(b.x - b.r * .28, b.y - b.r * .28, b.r * .22, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${b.alpha * .85})`;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(b.x + b.r * .18, b.y + b.r * .08, b.r * .08, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${b.alpha * .45})`;
        ctx.fill();
      });
    }

    function animate(now){
      if(!state.lastTime) state.lastTime = now;
      const dt = Math.min(.04, (now - state.lastTime) / 1000);
      state.lastTime = now;

      updateSimulation(dt, now);
      updateReadouts();
      drawScene();
      requestAnimationFrame(animate);
    }

    distanceButtons.forEach(btn => {
      btn.addEventListener('click', () => setDistance(Number(btn.dataset.distance)));
    });

    tempSlider.addEventListener('input', () => {
      state.temperature = Number(tempSlider.value);
      if(state.temperature === 30){
        statusLabel.textContent = 'Temperaturoptimum';
      }else if(state.temperature === 40){
        statusLabel.textContent = 'Grenzwert';
      }else if(state.temperature === 50){
        statusLabel.textContent = 'Denaturierung';
      }else{
        statusLabel.textContent = 'bereit';
      }
      updateReadouts();
    });

    rateChip.addEventListener('click', () => {
      state.rateVisible = true;
      updateReadouts();
    });

    rateChip.addEventListener('keydown', (event) => {
      if(event.key === 'Enter' || event.key === ' '){
        event.preventDefault();
        state.rateVisible = true;
        updateReadouts();
      }
    });

    windowToggle.addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', updateWindowToggle);

    startBtn.addEventListener('click', startMeasurement);
    pauseBtn.addEventListener('click', togglePause);
    resetBtn.addEventListener('click', reset);
    window.addEventListener('resize', fitCanvas);

    updateReadouts();
    updateWindowToggle();
    fitCanvas();
    requestAnimationFrame(animate);
  </script>

  <!-- edubiosim-fullscreen -->  <button id="fullscreenExitBtn" class="fullscreen-exit-btn" type="button" aria-label="Vollbildmodus verlassen" title="Vollbildmodus verlassen">
    <svg viewBox="0 0 28 28" aria-hidden="true" focusable="false">
      <path d="M5 3.8h10.5c1 0 1.8.8 1.8 1.8v16.8c0 1-.8 1.8-1.8 1.8H5V3.8Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M15.2 14h8.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M20.2 9.4 24.8 14l-4.6 4.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10.2 13.7h.1" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <span>Exit</span>
  </button>
    <script>
        // edubiosim-fullscreen
    (() => {
      const fullscreenEnterBtn = document.getElementById('fullscreenEnterBtn');
      const fullscreenExitBtn = document.getElementById('fullscreenExitBtn');
      const fullscreenRoot = document.documentElement;
      const isAppleTouchDevice = () => {
        const ua = navigator.userAgent || '';
        const platform = navigator.platform || '';
        return /iPad|iPhone|iPod/.test(ua) || (platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      };
      const disableAppleFullscreen = isAppleTouchDevice();
      if (disableAppleFullscreen) {
        fullscreenRoot.classList.add('apple-focus-device');
        fullscreenEnterBtn?.setAttribute('hidden', '');
        fullscreenExitBtn?.setAttribute('hidden', '');
      }
      const fullscreenInitialStartSelectors = [
        '#startSimulationBtn',
        '#startSimulation',
        '#introStart',
        '#introStartBtn',
        '#introModalStartBtn',
        '#startModal .start-btn',
        '#startModal #startSimulationBtn',
        '#startModal #startSimulation',
        '#introModal .im-start-btn',
        '#introOverlay #introStart',
        '#introBackdrop #introStartBtn',
        '#startMenu .btn-start',
        '.menu-overlay .btn-start',
        '.start-modal .start-btn',
        '.intro-modal .intro-start',
        '.intro-modal .start-btn',
        '[data-initial-start]'
      ];
      let initialAutoFullscreenTried = false;
      const isFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
      const syncFullscreenButton = () => fullscreenRoot.classList.toggle('fullscreen-active', isFullscreen());
      const enterFullscreen = async () => {
        if (disableAppleFullscreen || isFullscreen()) return;
        if (fullscreenRoot.requestFullscreen) await fullscreenRoot.requestFullscreen();
        else if (fullscreenRoot.webkitRequestFullscreen) await fullscreenRoot.webkitRequestFullscreen();
      };
      const exitFullscreen = async () => {
        if (!isFullscreen()) return;
        if (document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitExitFullscreen) await document.webkitExitFullscreen();
      };
      const bindInitialFullscreenStartTriggers = () => {
        const candidates = new Set();
        fullscreenInitialStartSelectors.forEach(selector => {
          document.querySelectorAll(selector).forEach(el => candidates.add(el));
        });
        candidates.forEach(el => {
          if (!el || el.dataset.fullscreenStartBound === '1') return;
          el.dataset.fullscreenStartBound = '1';
          el.addEventListener('click', () => {
            if (disableAppleFullscreen || initialAutoFullscreenTried) return;
            initialAutoFullscreenTried = true;
            enterFullscreen().catch(err => console.warn('Vollbild konnte nicht gestartet werden', err)).finally(syncFullscreenButton);
          }, { capture: true });
        });
      };
      fullscreenEnterBtn?.addEventListener('click', async () => {
        try {
          await enterFullscreen();
        } catch (err) {
          console.warn('Vollbild konnte nicht gestartet werden', err);
        } finally {
          syncFullscreenButton();
        }
      });
      fullscreenExitBtn?.addEventListener('click', async () => {
        try {
          await exitFullscreen();
        } catch (err) {
          console.warn('Vollbild konnte nicht beendet werden', err);
        } finally {
          syncFullscreenButton();
        }
      });
      document.addEventListener('fullscreenchange', syncFullscreenButton);
      document.addEventListener('webkitfullscreenchange', syncFullscreenButton);
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bindInitialFullscreenStartTriggers, { once: true });
      } else {
        bindInitialFullscreenStartTriggers();
      }
      syncFullscreenButton();
    })();
  </script>
