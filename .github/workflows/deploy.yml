name: Deploy to EduBioSim.de

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_FTP_SERVER: hosting240938.af92a.netcup.net
      DEPLOY_FTP_USERNAME: edubiosim
      DEPLOY_FTP_PASSWORD: ${{ secrets.NETCUP_FTP_PASSWORD || secrets.NETCUP_FTP_PASS || secrets.FTP_PASSWORD || secrets.FTP_PASS || secrets.NETCUP_PASSWORD || secrets.NETCUP_PASS }}
      DEPLOY_FTP_SERVER_DIR: httpdocs/

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Deploy-Ordner vorbereiten
        run: |
          set -euo pipefail

          rm -rf deploy
          mkdir -p deploy

          # Aktuelle Netcup-Root-Dateien als Webroot-Index bereitstellen
          cp index.html deploy/index.html
          cp index_EN.html deploy/index_EN.html

          # URLs auf die offizielle Domain anpassen
          sed -i 's|https://school-grammar-games.github.io/Biologie/Offizielle%20Webseite/Offizielle%20Webseite.html|https://www.edubiosim.de/|g' deploy/index.html deploy/index_EN.html
          sed -i 's|https://school-grammar-games.github.io/Biologie/Offizielle%20Webseite/Offizielle_Webseite_EN.html|https://www.edubiosim.de/index_EN.html|g' deploy/index.html deploy/index_EN.html
          sed -i 's|https://school-grammar-games.github.io/Biologie/|https://www.edubiosim.de/|g' deploy/index.html deploy/index_EN.html
          sed -i 's|https://school-grammar-games.github.io/Biologie|https://www.edubiosim.de|g' deploy/index.html deploy/index_EN.html
          sed -i 's|https://www.EduBioSim.de|https://www.edubiosim.de|g' deploy/index.html deploy/index_EN.html

          # Simulations-Pfade anpassen (../ entfernen)
          sed -i "s|path: '\.\./|path: '|g" deploy/index.html
          sed -i "s|path: '\.\./|path: '|g" deploy/index_EN.html

          # language-toggle.js liegt im Webroot
          sed -i 's|src="../language-toggle.js"|src="language-toggle.js"|g' deploy/index.html
          sed -i 's|src="../language-toggle.js"|src="language-toggle.js"|g' deploy/index_EN.html
          cp language-toggle.js deploy/language-toggle.js

          # Medien und QR-Codes der Hauptseite unter der urspruenglichen Struktur bereitstellen
          cp -r "Offizielle Webseite" "deploy/Offizielle Webseite"

          # Alle Simulations-Ordner kopieren
          for dir in Schall_Hoervorgang Mitose_und_Meiose Mendel "Meselson-Stahl-Versuch" Artbildung Einflussfaktoren_Fotosynthese Evolution_Kaeferspiel Nervenzelle_und_Synapse Attrappenversuche Angepasstheit_Insekten Strahlengang_Akkommodation Ernaehrung_Verdauung; do
            if [ -d "$dir" ]; then
              cp -r "$dir" "deploy/$dir"
            fi
          done

          # Alte lokale Video-Kopien der Insekten-Simulation nicht mehr deployen.
          rm -rf "deploy/Angepasstheit_Insekten/Videos"

          # Konfigurationsdateien kopieren, falls lokal vorhanden
          cp .htaccess deploy/.htaccess
          cp robots.txt deploy/robots.txt 2>/dev/null || true
          cp sitemap.xml deploy/sitemap.xml 2>/dev/null || true

      - name: Netcup FTP-Zugang pruefen
        run: |
          set -euo pipefail

          missing=0
          if [ -z "${DEPLOY_FTP_SERVER}" ]; then
            echo "::error::FTP-Server fehlt. Setze NETCUP_FTP_SERVER, FTP_SERVER oder FTP_HOST."
            missing=1
          fi
          if [ -z "${DEPLOY_FTP_USERNAME}" ]; then
            echo "::error::FTP-Benutzer fehlt. Setze NETCUP_FTP_USERNAME, NETCUP_FTP_USER, FTP_USERNAME oder FTP_USER."
            missing=1
          fi
          if [ -z "${DEPLOY_FTP_PASSWORD}" ]; then
            echo "::error::FTP-Passwort fehlt. Setze NETCUP_FTP_PASSWORD, NETCUP_FTP_PASS, FTP_PASSWORD oder FTP_PASS."
            missing=1
          fi
          if [ -z "${DEPLOY_FTP_SERVER_DIR}" ]; then
            echo "::error::FTP-Zielordner fehlt. Setze NETCUP_FTP_SERVER_DIR oder FTP_SERVER_DIR."
            missing=1
          fi

          echo "FTP-Server: ${DEPLOY_FTP_SERVER}"
          echo "FTP-Zielordner: ${DEPLOY_FTP_SERVER_DIR}"
          echo "FTP-Benutzer konfiguriert: $([ -n "${DEPLOY_FTP_USERNAME}" ] && echo ja || echo nein)"
          echo "FTP-Passwort konfiguriert: $([ -n "${DEPLOY_FTP_PASSWORD}" ] && echo ja || echo nein)"

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: lftp installieren
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Zu Netcup deployen
        run: |
          set -euo pipefail

          remote_dir="${DEPLOY_FTP_SERVER_DIR%/}/"

          lftp <<LFTP
          set cmd:fail-exit yes
          set ftp:passive-mode yes
          set ftp:ssl-allow yes
          set ftp:ssl-force no
          set ftp:ssl-protect-data no
          set ssl:verify-certificate no
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          open -u "${DEPLOY_FTP_USERNAME}","${DEPLOY_FTP_PASSWORD}" "${DEPLOY_FTP_SERVER}"
          mkdir -p "${remote_dir}"
          mirror --reverse --verbose --only-newer --parallel=1 --exclude-glob ".git*" --exclude-glob "node_modules" ./deploy/ "${remote_dir}"
          bye
          LFTP
