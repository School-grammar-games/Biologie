name: Deploy to EduBioSim.de

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_scope:
        description: "Was soll manuell deployed werden?"
        required: true
        default: root-assets
        type: choice
        options:
          - root-assets
          - changed
          - all-available

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_SOURCE: _netcup_deploy
      REMOTE_DELETE_MANIFEST: _netcup_remote_delete.txt
      SKIP_NETCUP: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[skip netcup]') }}
      DEPLOY_FTP_SERVER: hosting240938.af92a.netcup.net
      DEPLOY_FTP_USERNAME: edubiosim
      DEPLOY_FTP_PASSWORD: ${{ secrets.NETCUP_FTP_PASSWORD || secrets.NETCUP_FTP_PASS || secrets.FTP_PASSWORD || secrets.FTP_PASS || secrets.NETCUP_PASSWORD || secrets.NETCUP_PASS }}
      DEPLOY_FTP_SERVER_DIR: httpdocs/

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy-Paket vorbereiten
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          rm -rf deploy
          mkdir -p deploy
          : > changed-files.txt
          : > deploy-manifest.txt
          : > remote-delete-manifest.txt

          if [ "${SKIP_NETCUP}" = "true" ]; then
            echo "Commit ist mit [skip netcup] markiert; kein FTP-Deploy."
            echo "deploy_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          add_if_exists() {
            local path="$1"
            if [ -f "$path" ]; then
              printf '%s\n' "$path" >> changed-files.txt
            elif [ -d "$path" ]; then
              find "$path" -type f -print >> changed-files.txt
            fi
          }

          if [ -f "${REMOTE_DELETE_MANIFEST}" ]; then
            while IFS= read -r path || [ -n "$path" ]; do
              path="${path%$'\r'}"
              [ -n "$path" ] || continue
              case "$path" in
                /*|*..*|*\**|*\"*|*\\*)
                  echo "::error::Unsicherer Remote-Loeschpfad: $path"
                  exit 1
                  ;;
              esac
              printf '%s\n' "$path" >> remote-delete-manifest.txt
            done < "${REMOTE_DELETE_MANIFEST}"
          fi

          if [ ! -d "${DEPLOY_SOURCE}" ]; then
            echo "Deploy-Quelle ${DEPLOY_SOURCE} existiert nicht."
          else
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              case "${{ inputs.deploy_scope }}" in
                changed)
                  git diff --name-only HEAD^ HEAD > changed-files.txt
                  ;;
                all-available|root-assets)
                  add_if_exists "${DEPLOY_SOURCE}"
                  ;;
              esac
            elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              git diff --name-only "${{ github.event.before }}" "${GITHUB_SHA}" > changed-files.txt || git diff --name-only HEAD^ HEAD > changed-files.txt
            else
              git diff --name-only HEAD^ HEAD > changed-files.txt
            fi
          fi

          should_deploy_file() {
            case "$1" in
              "${DEPLOY_SOURCE}/"*)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          while IFS= read -r path; do
            [ -n "$path" ] || continue

            if ! should_deploy_file "$path"; then
              echo "Ueberspringe nicht produktiven Pfad: $path"
              continue
            fi

            if [ ! -f "$path" ]; then
              echo "Ueberspringe geloeschten/nicht vorhandenen Pfad: $path"
              continue
            fi

            target="${path#${DEPLOY_SOURCE}/}"
            mkdir -p "deploy/$(dirname "$target")"
            cp -p "$path" "deploy/$target"
            printf '%s\n' "$target" >> deploy-manifest.txt
          done < changed-files.txt

          for file in deploy/index.html deploy/index_EN.html; do
            [ -f "$file" ] || continue

            # Alte GitHub-Pages-Ziele auf die offizielle Domain normalisieren.
            sed -i 's|https://school-grammar-games.github.io/Biologie/Offizielle%20Webseite/Offizielle%20Webseite.html|https://www.edubiosim.de/|g' "$file"
            sed -i 's|https://school-grammar-games.github.io/Biologie/Offizielle%20Webseite/Offizielle_Webseite_EN.html|https://www.edubiosim.de/index_EN.html|g' "$file"
            sed -i 's|https://school-grammar-games.github.io/Biologie/|https://www.edubiosim.de/|g' "$file"
            sed -i 's|https://school-grammar-games.github.io/Biologie|https://www.edubiosim.de|g' "$file"
            sed -i 's|https://www.EduBioSim.de|https://www.edubiosim.de|g' "$file"
            sed -i "s|path: '\.\./|path: '|g" "$file"
            sed -i 's|src="../language-toggle.js"|src="language-toggle.js"|g' "$file"
          done

          if [ ! -s deploy-manifest.txt ] && [ ! -s remote-delete-manifest.txt ]; then
            echo "Keine relevanten Deploy-Dateien gefunden."
            echo "deploy_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -s deploy-manifest.txt ]; then
            echo "Folgende Dateien werden deployed:"
            cat deploy-manifest.txt
          fi
          if [ -s remote-delete-manifest.txt ]; then
            echo "Folgende Dateien werden auf Netcup geloescht:"
            cat remote-delete-manifest.txt
          fi
          echo "deploy_needed=true" >> "$GITHUB_OUTPUT"

      - name: Netcup FTP-Zugang pruefen
        if: steps.prepare.outputs.deploy_needed == 'true'
        run: |
          set -euo pipefail

          missing=0
          if [ -z "${DEPLOY_FTP_SERVER}" ]; then
            echo "::error::FTP-Server fehlt."
            missing=1
          fi
          if [ -z "${DEPLOY_FTP_USERNAME}" ]; then
            echo "::error::FTP-Benutzer fehlt."
            missing=1
          fi
          if [ -z "${DEPLOY_FTP_PASSWORD}" ]; then
            echo "::error::FTP-Passwort fehlt."
            missing=1
          fi
          if [ -z "${DEPLOY_FTP_SERVER_DIR}" ]; then
            echo "::error::FTP-Zielordner fehlt."
            missing=1
          fi

          echo "FTP-Server: ${DEPLOY_FTP_SERVER}"
          echo "FTP-Zielordner: ${DEPLOY_FTP_SERVER_DIR}"
          echo "FTP-Benutzer konfiguriert: $([ -n "${DEPLOY_FTP_USERNAME}" ] && echo ja || echo nein)"
          echo "FTP-Passwort konfiguriert: $([ -n "${DEPLOY_FTP_PASSWORD}" ] && echo ja || echo nein)"

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: lftp installieren
        if: steps.prepare.outputs.deploy_needed == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Zu Netcup deployen
        if: steps.prepare.outputs.deploy_needed == 'true'
        run: |
          set -euo pipefail

          remote_dir="${DEPLOY_FTP_SERVER_DIR%/}/"

          if [ -s remote-delete-manifest.txt ]; then
            {
              echo 'set cmd:fail-exit yes'
              echo 'set ftp:passive-mode yes'
              echo 'set ftp:ssl-allow yes'
              echo 'set ftp:ssl-force no'
              echo 'set ftp:ssl-protect-data no'
              echo 'set ssl:verify-certificate no'
              echo 'set net:timeout 30'
              echo 'set net:max-retries 3'
              echo 'set net:reconnect-interval-base 5'
              printf 'open -u "%s","%s" "%s"\n' "${DEPLOY_FTP_USERNAME}" "${DEPLOY_FTP_PASSWORD}" "${DEPLOY_FTP_SERVER}"
              while IFS= read -r path || [ -n "$path" ]; do
                path="${path%$'\r'}"
                [ -n "$path" ] || continue
                printf 'rm -f "%s%s"\n' "${remote_dir}" "$path"
              done < remote-delete-manifest.txt
              echo 'bye'
            } > delete-commands.lftp
            lftp -f delete-commands.lftp
          fi

          if [ ! -s deploy-manifest.txt ]; then
            echo "Nur Remote-Loeschungen auszufuehren; kein Upload-Paket."
            exit 0
          fi

          lftp <<LFTP
          set cmd:fail-exit yes
          set ftp:passive-mode yes
          set ftp:ssl-allow yes
          set ftp:ssl-force no
          set ftp:ssl-protect-data no
          set ssl:verify-certificate no
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          open -u "${DEPLOY_FTP_USERNAME}","${DEPLOY_FTP_PASSWORD}" "${DEPLOY_FTP_SERVER}"
          mkdir -p "${remote_dir}"
          mirror --reverse --verbose --parallel=1 --exclude-glob ".git*" --exclude-glob "node_modules" ./deploy/ "${remote_dir}"
          bye
          LFTP
