<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weiterleitung zu EduBioSim</title>
  <script>
    (function(){
      var u = new URL(location.href);
      u.protocol = 'https:';
      u.hostname = 'www.edubiosim.de';
      u.pathname = u.pathname.replace(/^\/Biologie\/?/, '/');
      var p = decodeURIComponent(u.pathname);
      if (p === '/' || p === '/index.html' || p === '/Offizielle Webseite/Offizielle Webseite.html') u.pathname = '/';
      if (p === '/Offizielle Webseite/Offizielle_Webseite_EN.html') u.pathname = '/index_EN.html';
      location.replace(u.toString());
    })();
  </script>
</head>
<body>
  <p>Diese Seite ist umgezogen: <a id="redirect-link" href="https://www.edubiosim.de/">www.edubiosim.de</a></p>
  <script>document.getElementById('redirect-link').href = new URL(location.href.replace('https://school-grammar-games.github.io/Biologie', 'https://www.edubiosim.de')).toString();</script>
</body>
</html>
